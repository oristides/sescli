# https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: sescli
    main: ./cmd/sescli
    binary: sescli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

  - id: sesmcp
    main: ./cmd/sesmcp
    binary: sesmcp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  # One archive per binary so install.sh can download sescli_* and sesmcp_* separately.
  # name_template requires {{ .Binary }} or both rows collide on the default project name.
  - id: archives-sescli
    ids: [sescli]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

  - id: archives-sesmcp
    ids: [sesmcp]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  algorithm: sha256

release:
  draft: false
